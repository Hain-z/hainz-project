<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lotto Number Generator</title>
  <link href='/style.css' rel='stylesheet'>
</head>
<body>
  <header class="top-bar">
    <h1>Lotto Number Generator</h1>
    <button id="theme-toggle" aria-label="Toggle dark or light mode">Dark mode</button>
  </header>
  <button id="generator-btn">Generate Numbers</button>
  <div id="numbers-container"></div>
  <section class="contact-section" aria-labelledby="contact-title">
    <h2 id="contact-title">Partnership Inquiry</h2>
    <form class="contact-form" action="https://formspree.io/f/xgollyvo" method="POST">
      <label class="field">
        <span>Company</span>
        <input type="text" name="company" placeholder="Company name" required />
      </label>
      <label class="field">
        <span>Contact Name</span>
        <input type="text" name="name" placeholder="Your name" required />
      </label>
      <label class="field">
        <span>Email</span>
        <input type="email" name="email" placeholder="you@example.com" required />
      </label>
      <label class="field field-full">
        <span>Message</span>
        <textarea name="message" placeholder="Tell us about the partnership" rows="5" required></textarea>
      </label>
      <button class="submit-btn" type="submit">Send Inquiry</button>
    </form>
  </section>
  <section class="comments-section" aria-labelledby="comments-title">
    <h2 id="comments-title">Comments</h2>
    <div id="disqus_thread"></div>
  </section>
  <script>

    })();
  </script>
  <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
  <script defer type="text/javascript" src="/main.js"></script>
</body>
</html>
