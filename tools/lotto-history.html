<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="로또 과거~최신 회차 당첨번호 조회와 최다 출현번호 통계">
  <meta name="google-adsense-account" content="ca-pub-8085950030726828">
  <title>로또 회차 기록/출현 통계 | Lotto Insight Lab</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/">Lotto Insight Lab</a>
      <nav class="main-nav" aria-label="주요 메뉴">
        <a href="/guides/lotto-basics.html">확률 기초</a>
        <a href="/guides/budget-plan.html">예산 계획</a>
        <a href="/guides/scam-checklist.html">사기 예방</a>
        <a href="/tools/lotto-generator.html">번호 도구</a>
        <a href="/tools/lotto-history.html">회차/통계</a>
      </nav>
      <button id="theme-toggle" class="theme-toggle" aria-label="다크 모드 전환">다크 모드</button>
    </div>
  </header>

  <main class="tool-wrap">
    <h1>로또 회차 기록/출현 통계</h1>
    <p>
      동행복권 회차 데이터를 기준으로 1회부터 최신 회차까지 당첨번호를 조회합니다.
      번호 출현 통계는 각 회차의 기본 6개 번호 기준입니다.
    </p>
    <p class="article-meta">
      참고: <a href="https://www.dhlottery.co.kr/lt645/intro" target="_blank" rel="noopener noreferrer">동행복권 로또6/45 소개</a>
    </p>

    <div class="stack">
      <div class="inline-controls">
        <button id="load-history-btn" class="button" type="button">전체 회차 불러오기</button>
        <label>
          회차 검색
          <input id="draw-search" type="number" min="1" step="1" placeholder="예: 1150">
        </label>
        <button id="sort-toggle-btn" class="button secondary" type="button">정렬: 최신순</button>
      </div>
      <p id="history-status" class="article-meta">아직 데이터를 불러오지 않았습니다.</p>
    </div>

    <section class="stats-wrap" aria-labelledby="stats-title">
      <h2 id="stats-title">가장 많이 나온 번호 Top 10</h2>
      <div id="top-numbers" class="chip-grid"></div>
    </section>

    <section class="table-wrap" aria-labelledby="history-table-title">
      <h2 id="history-table-title">회차별 당첨번호</h2>
      <table>
        <thead>
          <tr>
            <th>회차</th>
            <th>추첨일</th>
            <th>당첨번호(6개)</th>
            <th>보너스</th>
          </tr>
        </thead>
        <tbody id="history-body">
          <tr>
            <td colspan="4">데이터를 불러오면 표시됩니다.</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <p>© <span id="year"></span> Lotto Insight Lab</p>
      <nav aria-label="하단 메뉴">
        <a href="/about.html">사이트 소개</a>
        <a href="/contact.html">문의하기</a>
        <a href="/privacy.html">개인정보처리방침</a>
        <a href="/terms.html">이용약관</a>
      </nav>
    </div>
  </footer>
  <script defer src="/site.js"></script>
  <script defer src="/lotto-history.js"></script>
</body>
</html>
